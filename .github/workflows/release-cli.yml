name: Publish CLI

on:
  pull_request:
    paths:
      - ".github/workflows/release-cli.yml"
      - "scripts/check-release-contract.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "templates/**"
      - "skills/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE-*"
  workflow_dispatch:
    inputs:
      version:
        description: Alpha semver to publish, with or without the v prefix
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt

      - name: Validate version and source
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          manifest_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "logos-scaffold") | .version'
          )"
          version="$manifest_version"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
              echo "::error::Releases must be dispatched from master."
              exit 1
            fi
            version="${INPUT_VERSION#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "::error::Expected an alpha version such as 0.2.1-alpha.1."
            exit 1
          fi

          if [[ "$manifest_version" != "$version" ]]; then
            echo "::error::Cargo.toml has version '$manifest_version', requested '$version'."
            exit 1
          fi

          if ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version."
            exit 1
          fi

          tag="v${version}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] &&
            git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --check

      - name: Check release contract
        run: bash scripts/check-release-contract.sh

      - name: Test release source
        run: cargo test --locked --all-targets

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-24.04
            host_arch: x86_64
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
          - runs_on: macos-15
            host_arch: arm64
            target: aarch64-apple-darwin
            platform: darwin-arm64
    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Confirm native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.host_arch }}
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "::error::Expected native $EXPECTED_ARCH runner, got $actual_arch."
            exit 1
          fi

      - name: Build release binaries
        run: cargo build --locked --release --target "${{ matrix.target }}" --bins

      - name: Smoke-test release binaries
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          binary_dir="target/${TARGET}/release"
          for binary in logos-scaffold lgs; do
            version_output="$("${binary_dir}/${binary}" --version)"
            if [[ "$version_output" != "logos-scaffold ${VERSION}" ]]; then
              echo "::error::Unexpected ${binary} version output: ${version_output}"
              exit 1
            fi
            "${binary_dir}/${binary}" --help >/dev/null
          done

      - name: Package release archive
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          package="logos-scaffold-v${VERSION}-${PLATFORM}"
          package_dir="${RUNNER_TEMP}/${package}"
          archive="${RUNNER_TEMP}/${package}.tar.gz"

          mkdir -p "$package_dir" "${RUNNER_TEMP}/dist"
          install -m 0755 "target/${TARGET}/release/logos-scaffold" "$package_dir/"
          install -m 0755 "target/${TARGET}/release/lgs" "$package_dir/"
          install -m 0644 README.md LICENSE-APACHE LICENSE-MIT "$package_dir/"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$package"
          tar -tzf "$archive"
          mv "$archive" "${RUNNER_TEMP}/dist/"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Build and verify checksum manifest
        run: |
          set -euo pipefail
          cd dist
          mapfile -t archives < <(
            find . -maxdepth 1 -type f -name '*.tar.gz' -printf '%f\n' | sort
          )
          if [[ "${#archives[@]}" -ne 2 ]]; then
            echo "::error::Expected two release archives, found ${#archives[@]}."
            exit 1
          fi
          sha256sum -- *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create owned release tag
        id: create_tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA" >/dev/null
          echo "owned=true" >> "$GITHUB_OUTPUT"

      - name: Create exact owned draft
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if [[ ! -s "$notes" ]]; then
            echo "::error::Could not extract changelog entry for ${VERSION}."
            exit 1
          fi

          release_json="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$TAG" \
              -f body="$(cat "$notes")" \
              -F draft=true \
              -F prerelease=true \
              -f make_latest=false
          )"
          release_id="$(jq -er '.id' <<<"$release_json")"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
          echo "owned=true" >> "$GITHUB_OUTPUT"

      - name: Upload and verify exact draft
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.id }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq -e --arg tag "$TAG" --argjson id "$RELEASE_ID" '
              .id == $id and
              .tag_name == $tag and
              .draft == true and
              .prerelease == true and
              (.assets | length) == 0
            ' >/dev/null

          mapfile -t assets < <(
            find dist -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name 'SHA256SUMS' \) \
              -printf '%f\n' | sort
          )
          if [[ "${#assets[@]}" -ne 3 ]]; then
            echo "::error::Expected three release assets, found ${#assets[@]}."
            exit 1
          fi

          for asset_name in "${assets[@]}"; do
            encoded_name="$(
              jq -nr --arg value "$asset_name" '$value | @uri'
            )"
            asset_json="$(
              curl --fail-with-body --silent --show-error --location \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/octet-stream" \
                --data-binary @"dist/$asset_name" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$encoded_name"
            )"
            jq -e --arg name "$asset_name" '
              .name == $name and .state == "uploaded"
            ' <<<"$asset_json" >/dev/null
          done

          release_json="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          )"
          jq -e --arg tag "$TAG" '
            .tag_name == $tag and
            .draft == true and
            .prerelease == true and
            (.assets | length) == 3
          ' <<<"$release_json" >/dev/null

          verify_dir="${RUNNER_TEMP}/published-assets"
          mkdir -p "$verify_dir"
          jq -r '.assets[] | [.id, .name] | @tsv' <<<"$release_json" |
            while IFS=$'\t' read -r asset_id asset_name; do
              gh api -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                > "$verify_dir/$asset_name"
            done
          diff -u dist/SHA256SUMS "$verify_dir/SHA256SUMS"
          (
            cd "$verify_dir"
            sha256sum -c SHA256SUMS
          )

          tag_target="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object.sha'
          )"
          test "$tag_target" = "$GITHUB_SHA"

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq -e --arg tag "$TAG" '
              .tag_name == $tag and
              .draft == false and
              .prerelease == true and
              (.assets | length) == 3
            ' >/dev/null
          published_tag_target="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object.sha'
          )"
          test "$published_tag_target" = "$GITHUB_SHA"

      - name: Roll back only owned failed state
        if: >-
          always() &&
          steps.create_tag.outputs.owned == 'true' &&
          steps.publish_release.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.id }}
          RELEASE_OWNED: ${{ steps.create_release.outputs.owned }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          cleanup_failed=0
          can_delete_tag=false

          if [[ "$RELEASE_OWNED" == "true" ]]; then
            if [[ -z "$RELEASE_ID" ]]; then
              echo "::error::Owned release ID is missing."
              cleanup_failed=1
            elif ! gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"; then
              cleanup_failed=1
            else
              can_delete_tag=true
            fi
          else
            echo "Preserving owned tag because no owned release ID is available."
          fi

          if [[ "$can_delete_tag" == "true" ]] &&
              ! git push --porcelain \
                --force-with-lease="refs/tags/$TAG:$GITHUB_SHA" \
                origin ":refs/tags/$TAG"; then
            refs="[]"
            if ! refs="$(
              gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG"
            )"; then
              cleanup_failed=1
            else
              tag_target="$(
                jq -r --arg ref "refs/tags/$TAG" '
                  first(.[] | select(.ref == $ref) | .object.sha) // empty
                ' <<<"$refs"
              )"
              if [[ "$tag_target" == "$GITHUB_SHA" ]]; then
                echo "::error::Failed to delete the owned release tag."
                cleanup_failed=1
              elif [[ -n "$tag_target" ]]; then
                echo "Preserving tag moved to $tag_target."
              fi
            fi
          fi

          exit "$cleanup_failed"
